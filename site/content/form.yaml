# Demande de trajet AFR TAXI — contrat partagé navigateur / serveur
# (engine/form/contract.ts, usine 0.2.0). Le serveur fait foi.
#
# Champs limités à ce qui sert à organiser un trajet. AUCUNE donnée médicale :
# ni diagnostic, ni ordonnance, ni numéro de sécurité sociale, ni motif.
# Les bornes ci-dessous sont des limites de SAISIE, pas une capacité du véhicule
# (capacité réelle : fait vehicle.capacity, inconnu à ce jour).
# Délai minimal de 60 min : PROPOSITION à valider avec le chauffeur
# (pour un départ imminent, le site oriente vers l'appel).
fields:
  - name: pickup
    kind: text
    required: true
    maxLength: 200
    autocomplete: off
    label: { fr: Adresse de départ }
    hint: { fr: 'Adresse, gare ou lieu connu. Exemple : gare de Saint-Rambert-d’Albon.' }
  - name: dropoff
    kind: text
    required: true
    maxLength: 200
    autocomplete: off
    label: { fr: Destination }
  - name: date
    kind: date
    required: true
    maxLength: 10
    label: { fr: Date du départ }
  - name: time
    kind: time
    required: true
    maxLength: 5
    label: { fr: Heure du départ }
    hint: { fr: Heure de Paris. }
  - name: passengers
    kind: integer
    required: false
    maxLength: 2
    min: 1
    max: 99
    label: { fr: Nombre de voyageurs }
  - name: travel_ref
    kind: text
    required: false
    maxLength: 40
    autocomplete: off
    label: { fr: Numéro de train ou de vol }
    hint: { fr: Utile pour un transfert. }
  - name: details
    kind: textarea
    required: false
    maxLength: 600
    label: { fr: Précisions utiles }
    hint: { fr: 'Bagages, siège enfant, aller-retour… N’indiquez aucune information médicale.' }
  - name: name
    kind: text
    required: true
    maxLength: 120
    autocomplete: name
    label: { fr: Nom et prénom }
  - name: phone
    kind: tel
    required: true
    maxLength: 30
    autocomplete: tel
    label: { fr: Téléphone pour vous rappeler }
    hint: { fr: 'Numéro français ou international (+…).' }
  - name: email
    kind: email
    required: false
    maxLength: 254
    autocomplete: email
    label: { fr: E-mail }
    hint: { fr: 'Facultatif : le chauffeur vous rappelle par téléphone.' }
rules:
  - kind: datetime-future
    date: date
    time: time
    timeZone: Europe/Paris
    minLeadMinutes: 60
    maxDaysAhead: 365
honeypot: website
results:
  fr: { accepted: /contact/envoyee/, invalid: /contact/a-corriger/, unavailable: /contact/indisponible/ }
subject:
  fr: Demande de trajet via le site
