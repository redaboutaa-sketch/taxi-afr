# Demande de trajet AFR TAXI — contrat partagé navigateur / serveur
# (engine/form/contract.ts, usine 0.2.0). Le serveur fait foi.
#
# Version simplifiée (décision du 2026-11-24) : le strict nécessaire pour que
# le chauffeur rappelle et organise le trajet. AUCUNE donnée médicale.
# Bornes = limites de SAISIE, pas une capacité du véhicule.
# Délai minimal de 60 min : proposition à valider (sinon : appeler).
fields:
  - name: name
    kind: text
    required: true
    maxLength: 120
    autocomplete: name
    label: { fr: Nom et prénom }
  - name: phone
    kind: tel
    required: true
    maxLength: 30
    autocomplete: tel
    label: { fr: Téléphone }
  - name: pickup
    kind: text
    required: true
    maxLength: 200
    autocomplete: off
    label: { fr: Adresse de départ }
  - name: dropoff
    kind: text
    required: true
    maxLength: 200
    autocomplete: off
    label: { fr: Destination }
  - name: date
    kind: date
    required: true
    maxLength: 10
    label: { fr: Date }
  - name: time
    kind: time
    required: true
    maxLength: 5
    label: { fr: Heure }
  - name: passengers
    kind: integer
    required: false
    maxLength: 2
    min: 1
    max: 99
    label: { fr: Voyageurs }
rules:
  - kind: datetime-future
    date: date
    time: time
    timeZone: Europe/Paris
    minLeadMinutes: 60
    maxDaysAhead: 365
honeypot: website
results:
  fr: { accepted: /contact/envoyee/, invalid: /contact/a-corriger/, unavailable: /contact/indisponible/ }
subject:
  fr: Demande de trajet via le site
