# yaml-language-server: $schema=../../engine/contracts/brief.schema.json
#
# AFR TAXI — refonte de https://www.afr-taxi.fr/ (site client RÉEL), publiée sur
# afr-taxi.com : l'ancien propriétaire conserve afr-taxi.fr (décision du 2026-11-26).
#
# Provenance des valeurs : tableau « Faits : préremplir, puis confirmer » du
# brief de mission du 2026-11-24, lui-même issu du site actuel. Le site actuel
# n'a PAS pu être relu depuis cette session (hôte hors réseau autorisé) :
# toutes les valeurs sont `proposed` au mieux. Aucun agent ne passe un fait
# en `confirmed` : c'est une décision du client (AGENTS.md, invariant 4).
#
# Identités e-mail : compte Gmail du taxi (voir section email).
schemaVersion: 1
mode: release

site:
  id: afr-taxi

identity:
  brand: AFR TAXI
  fictional: false
  establishmentCountry: FR

market:
  audience: >-
    Particuliers, professionnels et voyageurs autour de Saint-Rambert-d'Albon
    (Drôme) qui ont besoin d'un taxi pour un trajet local, un transfert vers une
    gare ou un aéroport, ou un déplacement planifié.
  targetCountries: [FR]
  objectives:
    - Permettre d'appeler facilement, depuis un téléphone, sans dépendance à un script.
    - Permettre de décrire un trajet planifié sans échange inutile (départ, destination, date, heure, rappel).
    - Expliquer les services et leurs conditions sans confusion (médical et assistance séparés).
    - Montrer un professionnel local réel et ses preuves autorisées.
    - Préserver les URL utiles du site actuel.
  differentiationFacts: [business.locality, business.hours]
  primaryCta:
    kind: phone
    label:
      fr: Appeler

offer:
  kind: services
  categories:
    - id: taxi-prive
      label: { fr: Taxi privé et professionnel }
    - id: transferts
      label: { fr: Transferts gares et aéroports }
    - id: assistance-deplacement
      label: { fr: Déplacement après un incident }
    - id: transport-medical
      label: { fr: Transport de patients conventionné }
  exclusions:
    - Pas de réservation instantanément confirmée ni de disponibilité en temps réel.
    - Pas de paiement en ligne, de compte client ni de tarification automatique (hors V1).
    - Pas de remorquage, d'ambulance ni de secours (le service d'assistance transporte des personnes).
  pricingFact: offer.pricing
  availabilityFact: business.hours

network:
  # afr-taxi.com acheté par le propriétaire (Hostinger, 2026-11-26) ; www canonique,
  # l'apex redirige vers www (une seule redirection 301, production uniquement).
  canonicalOrigin: https://www.afr-taxi.com
  redirectDomains: [afr-taxi.com]
  previewOrigin: null

email:
  # Décision du propriétaire (2026-11-27) : envoi par Brevo (relais SMTP authentifié)
  # avec l'adresse contact@afr-taxi.com, domaine afr-taxi.com authentifié chez Brevo
  # (DKIM/DMARC). Les demandes sont livrées directement dans la boîte Gmail du taxi.
  # Identifiants (login SMTP Brevo + clé SMTP) : variables d'environnement seulement.
  publicContactFact: contact.email
  recipient: afr.taxi26@gmail.com
  from: contact@afr-taxi.com
  sendingDomain: afr-taxi.com
  replyTo: submitter
  transport: smtp
  smtp:
    host: smtp-relay.brevo.com
    port: 587
    security: starttls
    username: env:AFR_SMTP_USER
    password: env:AFR_SMTP_PASSWORD

form:
  enabled: true

i18n:
  defaultLocale: fr
  locales: [fr]
  missingTranslation: omit

design:
  references:
    - url: https://www.afr-taxi.fr/
      note: Ancien site, domaine conservé par l'ancien propriétaire (aucune redirection possible) ; ambiance sombre et longs titres à ne pas reproduire.
  antiReferences:
    - Ambiance sombre, faible hiérarchie et titres longs du site actuel.
    - Faux avis, badges, logos d'organismes ou partenariats non confirmés.
    - Photos de véhicules plus haut de gamme ou générées présentées comme le taxi du client.
    - Hero centré + trois cartes identiques sur toutes les pages.
  brandConstraints:
    - Ton de professionnel local soigneux, pas de compagnie de limousines.
    - Respecter le logo existant s'il est fourni et autorisé ; ne pas le redessiner.
  availableResources:
    - "Photo du véhicule réel devant la gare de Saint-Rambert-d’Albon, transmise le 2026-11-24 (registre d’actifs, id taxi-gare). Logo original non fourni."
    - Maquette d'accueil transmise par le propriétaire le 2026-11-24 (provenance des images inconnue, référence de composition seulement).
  # Décision du propriétaire du dépôt (accord écrit du 2026-11-25) : illustrations
  # d'ambiance des cartes de services, sans personne ni véhicule du client, marquées « Illustration ».
  allowGeneratedIllustrations: true
  selectedDirection:
    id: b-bandeau
    decidedBy: propriétaire du dépôt (message du 2026-11-24)
    decidedOn: '2026-11-24'
    note: Choix de la piste B « Bandeau » (maquette corrigée) ; le rendu final reste à approuver.
  renderApproval:
    approvedBy: Reda Boutaa
    approvedOn: '2026-11-26'
    scope: Rendu de la piste B « Bandeau » tel que présenté en préversion (accueil, services, contact, pages légales).

hosting:
  profile: vps-nginx
  phpVersion: '8.4'
  notes:
    - Cible réelle d'hébergement NON constatée ; vps-nginx est le seul profil implémenté et recetté (conteneurs). Un mutualisé Apache n'est pas couvert.

privacy:
  processing:
    - purpose: Transmettre au chauffeur une demande de trajet saisie dans le formulaire (canal e-mail) pour qu'il rappelle et confirme ou non la course.
      recipients: [AFR TAXI (chauffeur)]
      retentionFact: privacy.requestRetention
  thirdPartyTools:
    - WhatsApp (Meta) — seulement si le visiteur choisit ce canal ; lien sortant au clic, aucun widget chargé.
  analytics: none

delivery:
  scope:
    - "Site français : accueil, taxi privé, transferts, à propos, contact (demande e-mail ou WhatsApp), assistance (orientation), transport médical et assistance déplacement (conditionnels), mentions légales, vie privée, 404."
  reviewer: Reda Boutaa
  # Autorisation de Reda Boutaa (message du 2026-11-26 : « J'autorise la publication
  # sur www.afr-taxi.com »). scopeDigest = empreinte des pages de production
  # autorisées (site/deploy/pages-digest.sh sur le dossier public/ de la release).
  publicationAuthorization:
    # 2026-11-27 : « J'autorise la publication de la version 8b3a579e sur
    # www.afr-taxi.com » (Reda Boutaa) — relecture de cohérence des contenus.
    grantedBy: Reda Boutaa
    grantedOn: '2026-11-27'
    scopeDigest: 8b3a579e9ea7fa15baa32bdfa3b7ef43fbe038e58b2f88e613b40ed628c4b8b0

